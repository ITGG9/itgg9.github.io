<!DOCTYPE html><html><head><title>TikTok Auth Callback</title></head><body>
<h2 id="status">Processing...</h2>
<p id="code-display" style="font-size:20px;word-break:break-all;background:#f0f0f0;padding:20px;border-radius:8px;"></p>
<script>
const p = new URLSearchParams(location.search);
const code = p.get('code');
const err = p.get('error');
if (code) {
  document.getElementById('status').textContent = 'Auth Code Received!';
  document.getElementById('status').style.color = 'green';
  document.getElementById('code-display').innerHTML = '<b>CODE:</b> ' + code;
  localStorage.setItem('tiktok_code', code);
} else if (err) {
  document.getElementById('status').textContent = 'Error: ' + err;
  document.getElementById('status').style.color = 'red';
} else {
  document.getElementById('status').textContent = 'No code in URL';
}
</script></body></html>
